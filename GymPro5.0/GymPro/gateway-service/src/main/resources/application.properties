# ── Gateway's own aggregated Swagger UI ────────────────────────────────────
# http://localhost:8080/swagger-ui/index.html shows a service dropdown that
# switches between every microservice's OpenAPI doc, each fetched through
# the routes above (so gateway CORS/JWT behavior matches real traffic).
