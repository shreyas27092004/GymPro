# ─────────────────────────────────────────────────────────────────────────
# Swagger / OpenAPI routes.
# SpringDoc's DEFAULT paths are used on every downstream service:
#   /v3/api-docs         (OpenAPI JSON)
#   /swagger-ui/**        (Swagger UI static assets)
#   /swagger-ui.html      (Swagger UI redirect entrypoint)
# Each route is exposed under a "/<service-name>/..." prefix on the gateway
# and rewritten back to the real default path before being forwarded to the
# downstream instance. These prefixed paths are what the gateway's own
# aggregated Swagger UI (springdoc.swagger-ui.urls below) points at.
# ─────────────────────────────────────────────────────────────────────────
spring.cloud.gateway.routes[16].id=auth-service-apidocs
spring.cloud.gateway.routes[16].uri=lb://auth-service
spring.cloud.gateway.routes[16].predicates[0]=Path=/auth-service/v3/api-docs/**
spring.cloud.gateway.routes[16].filters[0]=RewritePath=/auth-service/(?<remaining>.*), /${remaining}

