
server.port=8088
spring.application.name=chatbot-service

# ── Eureka (local: point to localhost, not the Docker hostname) ───────────────
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${server.port}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# ── Google Gemini ─────────────────────────────────────────────────────────────
# Set GEMINI_API_KEY as an environment variable in your IDE run configuration.
# Get a free key at: https://aistudio.google.com/app/apikey
gemini.api.key=${GEMINI_API_KEY:YOUR_GEMINI_API_KEY_HERE}
gemini.model=gemini-2.5-flash
gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models/${gemini.model}:generateContent

# ── HTTP Client Timeouts ──────────────────────────────────────────────────────
gemini.connect.timeout.ms=10000
gemini.read.timeout.ms=30000

# ── Chatbot behaviour ─────────────────────────────────────────────────────────
chatbot.max.history=20

# ── Logging ───────────────────────────────────────────────────────────────────
logging.level.com.gympro.chatbot=INFO
logging.level.org.springframework.web=WARN
logging.level.org.springframework.cloud.netflix.eureka=WARN

# ── Actuator / Health ─────────────────────────────────────────────────────────
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true

# ── Swagger / OpenAPI ─────────────────────────────────────────────────────────
springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true
springdoc.swagger-ui.display-request-duration=true
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=alpha
